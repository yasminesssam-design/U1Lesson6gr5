<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الدرس السادس - مشاركة المعلومات | محترف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Tajawal,Tahoma,sans-serif;font-size:22px;color:#12335b;background:linear-gradient(135deg,#1e5aa8,#7b3fe4,#ff8a00,#00b894);background-size:400% 400%;animation:bg 14s ease infinite;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@keyframes bg{50%{background-position:100% 50%}}
.fl{position:fixed;top:105%;font-size:34px;animation:up linear infinite;opacity:.6;pointer-events:none}
@keyframes up{to{top:-10%;transform:rotate(360deg)}}
#app{position:relative;max-width:820px;margin:auto;padding:14px}
.logo{display:block;width:120px;margin:0 auto;background:#fff;border-radius:50%;padding:6px;animation:pop 3s infinite}
@keyframes pop{50%{transform:scale(1.07)}}
.card{background:#fff;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 8px 24px #0004}
h1,h2{margin:6px 0;text-align:center}h1{color:#fff;text-shadow:0 3px 6px #0006;font-size:30px}
button,input{font-family:inherit;font-size:22px}
.b{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:18px;background:#1e5aa8;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0c3366;unicode-bidi:plaintext}
.b:active{transform:translateY(4px);box-shadow:none}.b.o{background:#f39c12;box-shadow:0 5px 0 #a86400}.b.g{background:#00a86b;box-shadow:0 5px 0 #006b44}.b.p{background:#7b3fe4;box-shadow:0 5px 0 #4a1fa0}
.op{background:#eef4ff;color:#12335b;box-shadow:0 4px 0 #b6c8e8;text-align:right}
.ok{background:#2ecc71!important;color:#fff}.no{background:#e74c3c!important;color:#fff;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
input{width:100%;padding:12px;border:3px solid #1e5aa8;border-radius:14px;text-align:center;direction:rtl}
.bar{height:14px;background:#dde;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#00b894;transition:.4s}
.big{font-size:70px;text-align:center}.sec{color:#7b3fe4;font-size:18px;text-align:center}
.box{background:#fff8e1;border-right:8px solid #f39c12;border-radius:14px;padding:12px;margin:10px 0}
.f{direction:ltr;display:inline-block;background:#e8f5e9;padding:2px 10px;border-radius:8px;font-family:monospace}
.emo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;pointer-events:none;animation:ez .9s forwards;z-index:9}
@keyframes ez{0%{transform:scale(.2);opacity:1}70%{opacity:1}100%{transform:scale(1.4);opacity:0}}
.cf{position:fixed;top:-20px;width:12px;height:16px;animation:cf 2.5s linear forwards;z-index:9}@keyframes cf{to{top:105%;transform:rotate(720deg)}}
</style></head><body>
<script>for(let i=0;i<14;i++){const s=document.createElement('div');s.className='fl';s.textContent=['💻','🌐','📊','⭐','🔒','📁','🚀'][i%7];s.style.cssText+=`right:${i*7}%;animation-duration:${9+i%6*3}s;animation-delay:${-i*2}s`;document.body.appendChild(s)}</script>

['اختبر نفسك ٢: اختر الإجابة الصحيحة',[C('شبكة … تسمح بمشاركة المعلومات العامة للجميع.',['الإنترنت','الإنترانت','مغلقة','LAN'],0),C('تُستخدم الصيغة … للحصول على ناتج قسمة قيمة الخلية A8 على قيمة الخلية B8.',['=A8/B8','A8/B8','=A8+B8','A8+B8'],0),C('لعمل فرز أو ترتيب للخلايا نذهب إلى تبويب …',['إدراج Insert','عرض View','تخطيط Layout','بيانات Data'],3),C('يُستخدم برنامج … في إجراء العمليات الحسابية.',['PowerPoint','Word','Excel','Paint'],2),C('تُستخدم شبكة … لمشاركة المعلومات وهي أقل أماناً.',['البريد','الإنترنت','الإنترانت','مغلقة'],1),C('يتم كتابة الصيغ الحسابية داخل … في برنامج إكسل.',['الرسائل النصية','الصور','الرسم البياني','الخلية'],3),C('شبكة … تشبه العائلة من حيث الأمان.',['الإنترنت','الإنترانت','الهاتف','الحاسوب'],1)]],
['اختبر نفسك ٣: أكمل من بين القوسين (جمع – * – فرز – الإنترنت – طرح – =)',[['يسمح اختيار … بترتيب المعلومات أبجدياً في برنامج إكسل.',2],['تُعبر المعادلة F4-G4 = عن … قيمة الخلية G4 من F4.',4],['يُعبر الرمز … عن عملية الضرب داخل برنامج Excel.',1],['يُستخدم … لمشاركة المعلومات حول العالم.',3],['لإنشاء صيغة بسيطة داخل برنامج Excel يجب كتابة علامة … في بداية الخلية.',5]].map(([q,a])=>C(q,['جمع','*','فرز','الإنترنت','طرح','='],a))],
['اختبر نفسك ٤: أكمل الجمل (اكتب الإجابة)',[T('الشبكة الداخلية تُعرف باسم شبكة …',['الانترانت','انترانت','داخليه']),T('يجب أن نكون … عند استخدام الإنترنت.',['حذرين','حذر']),T('لا تشارك معلوماتك … على الإنترنت.',['الشخصيه','شخصيه','الشخصيةكاملا']),T('الإنترنت يُعتبر … عالمية.',['شبكه']),T('برنامج … يساعدنا على إجراء العمليات الحسابية.',['اكسل','EXCEL','مايكروسوفتاكسل'])]],
['اختبر نفسك ٥: اكتب الصيغة المناسبة في Excel',[T('جمع القيم الموجودة في الخليتين C2 وD3.',['=C2+D3','=D3+C2']),T('طرح قيمة الخلية A5 من قيمة الخلية B5.',['=B5-A5']),T('ضرب القيم الموجودة في الخلايا A1 وB2 وC1.',['=A1*B2*C1','=A1*C1*B2','=B2*A1*C1','=B2*C1*A1','=C1*A1*B2','=C1*B2*A1']),T('قسمة قيمة الخلية D4 على قيمة الخلية A2.',['=D4/A2']),T('طرح قيمة الخلية C3 من مجموع الخليتين A3 وB3.',['=A3+B3-C3','=B3+A3-C3'])]],

let name='',cur,qs,i,sc,title,log;
const hdr=()=>`<img class="logo" src="${LOGO}" alt="Mohtarf">`;
function home(){
$.innerHTML=hdr()+`<h1>الدرس السادس: مشاركة المعلومات 🎁<br><small>متى؟ وأين؟ وكيف؟</small></h1><div class="card"><h2>👋 أهلاً بك يا بطل!</h2><p style="text-align:center">اكتب اسمك أولاً:</p><input id="nm" placeholder="اسم الطالب" value="${name}"><button class="b g" onclick="go()">🚀 ابدأ</button></div>`}
function go(){const v=document.getElementById('nm').value.trim();if(!v){emo('✍️');return}name=v;snd(660);menu()}
function menu(){$.innerHTML=hdr()+`<h1>أهلاً ${name} 🌟</h1><div class="card"><h2>اختر ما تريد</h2><button class="b g" onclick="full()">📖 الدرس كاملاً في شريحة واحدة (+ 6 أسئلة بعد كل جزء)</button><button class="b" style="background:#e74c3c;box-shadow:0 5px 0 #8e1e12" onclick="exam()">🏆 الاختبار النهائي (${EX.reduce((a,s)=>a+s[1].length,0)} سؤالاً)</button></div>`}
let AN={};
function full(){AN={};window._d=0;let h=hdr()+`<h1>🎁 الدرس السادس كاملاً</h1>`;
L.forEach((p,k)=>{h+=`<div class="card"><h2>${p.e} الجزء ${k+1}: ${p.n}</h2>${p.txt.map(t=>`<p style="line-height:1.9">${t}</p>`).join('')}</div><div class="card" style="background:#f0f6ff"><h2>✏️ أسئلة الجزء ${k+1}</h2>${p.q.map((x,j)=>`<div style="margin:14px 0;padding:10px;border-radius:16px;background:#fff"><b>${j+1}) ${x.q}</b>${x.o.map((o,m)=>`<button class="b op" id="i${k}_${j}_${m}" onclick="ip(${k},${j},${m})">${W[m]}) ${o}</button>`).join('')}<div id="f${k}_${j}"></div></div>`).join('')}</div>`});
$.innerHTML=h+`<div class="card" id="res"></div>`;upd();window.scrollTo(0,0)}
function ip(k,j,m){const key=k+'_'+j;if(key in AN)return;const x=L[k].q[j],ok=m==x.a;AN[key]=ok;
document.getElementById(`i${key}_${m}`).classList.add(ok?'ok':'no');if(!ok)document.getElementById(`i${key}_${x.a}`).classList.add('ok');
document.getElementById('f'+key).innerHTML=ok?'<div class="box">🎉 أحسنت!</div>':'<div class="box">💡 الإجابة الصحيحة: <b>'+x.o[x.a]+'</b></div>';ok?good():bad();upd()}
function upd(){const n=Object.keys(AN).length,t=L.reduce((a,p)=>a+p.q.length,0),c=Object.values(AN).filter(v=>v).length;
window._m=`📚 منصة محترف - الصف الخامس الابتدائي\nالدرس السادس: مشاركة المعلومات\nالطالب: ${name}\nأسئلة أجزاء الدرس\nالنتيجة: ${c} من ${t}`;
document.getElementById('res').innerHTML=`<h2>⭐ نتيجتك: ${c} من ${t} (أجبت عن ${n})</h2><button class="b g" onclick="wa()">📲 أرسل النتيجة إلى واتساب</button><button class="b" style="background:#e74c3c;box-shadow:0 5px 0 #8e1e12" onclick="exam()">🏆 اذهب إلى الاختبار النهائي</button>`;if(n==t&&!window._d){window._d=1;conf()}}
function lesson(k,pg=0){const p=L[k];snd(500,.1);
$.innerHTML=hdr()+`<h1>${p.e} ${p.n}</h1><div class="card"><div class="sec">${pg+1} / ${p.txt.length}</div><div class="bar"><i style="width:${(pg+1)/p.txt.length*100}%"></i></div><p style="line-height:1.9">${p.txt[pg]}</p>${pg<p.txt.length-1?`<button class="b" onclick="lesson(${k},${pg+1})">التالي ⬅️</button>`:`<button class="b g" onclick="part(${k})">✏️ ابدأ الأسئلة الستة</button>`}${pg?`<button class="b o" onclick="lesson(${k},${pg-1})">➡️ السابق</button>`:''}<button class="b op" onclick="menu()">🏠 القائمة</button></div>`}
function part(k){cur=k;title=L[k].n;qs=L[k].q.map(x=>({...x,s:''}));start()}
function exam(){cur='x';title='الاختبار النهائي';qs=EX.flatMap(([s,a])=>a.map(x=>({...x,s})));start()}
function start(){i=0;sc=0;log=[];show()}
function show(){const x=qs[i];
let h=hdr()+`<div class="card"><div class="sec">${title}${x.s?' — '+x.s:''}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="sec">السؤال ${i+1} من ${qs.length} | ⭐ ${sc}</div><h2 style="line-height:1.7">${x.q}</h2>`;
if(x.o)h+=x.o.map((o,k)=>`<button class="b op" id="o${k}" onclick="pick(${k})">${W[k]||k+1}) ${o}</button>`).join('');
else h+=`<input id="tx" dir="auto" placeholder="اكتب إجابتك"><button class="b g" onclick="chk()">✔️ تأكيد</button>`;
$.innerHTML=h+`<div id="fb"></div></div>`}
function done(ok,right){const x=qs[i];if(ok){sc++;good()}else bad();log.push(ok);
document.getElementById('fb').innerHTML=`<div class="box">${ok?'🎉 أحسنت! إجابة صحيحة':'💡 الإجابة الصحيحة: <b>'+right+'</b>'}</div><button class="b" onclick="nx()">${i<qs.length-1?'التالي ⬅️':'🏁 النتيجة'}</button>`}
function pick(k){const x=qs[i];if(document.querySelector('.ok,.no'))return;document.getElementById('o'+k).classList.add(k==x.a?'ok':'no');if(k!=x.a)document.getElementById('o'+x.a).classList.add('ok');done(k==x.a,x.o[x.a])}
function chk(){const x=qs[i],t=document.getElementById('tx');if(t.disabled)return;const v=norm(t.value);if(!v)return;t.disabled=true;const ok=x.t.some(a=>norm(a)==v||(!a.startsWith('=')&&v.length>2&&norm(a).includes(v)));t.style.background=ok?'#2ecc71':'#e74c3c';done(ok,x.t[0])}
function nx(){snd(500,.08);if(++i<qs.length)show();else fin()}
function fin(){const p=Math.round(sc/qs.length*100);if(p>=50)conf();
const st=p>=90?'🏆 ممتاز!':p>=70?'🌟 جيد جداً!':p>=50?'👍 جيد':'💪 حاول مرة أخرى';
const msg=`📚 منصة محترف - الصف الخامس الابتدائي\nالدرس السادس: مشاركة المعلومات\nالطالب: ${name}\n${title}\nالنتيجة: ${sc} من ${qs.length} (${p}%)`;
window._m=msg;
$.innerHTML=hdr()+`<div class="card"><div class="big">${p>=50?'🥳':'🤗'}</div><h2>${st}</h2><h1 style="color:#1e5aa8;text-shadow:none">${sc} / ${qs.length} (${p}%)</h1><button class="b g" onclick="wa()">📲 أرسل النتيجة إلى واتساب</button><button class="b o" onclick="cur=='x'?exam():part(cur)">🔄 أعد المحاولة</button><button class="b op" onclick="menu()">🏠 القائمة</button></div>`}
function wa(){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(window._m)}`,'_blank')}
home();
</script></body></html>
